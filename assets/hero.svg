<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b;#ec4899;#8b5cf6;#06b6d4;#10b981;#f59e0b" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#8b5cf6;#06b6d4;#10b981;#f59e0b;#ec4899" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="600" cy="200" r="300" fill="url(#glow)">
    <animate attributeName="r" values="280;340;280" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.6">
    <path d="M0 100 L1200 100 M0 200 L1200 200 M0 300 L1200 300"/>
    <path d="M200 0 L200 400 M400 0 L400 400 M600 0 L600 400 M800 0 L800 400 M1000 0 L1000 400"/>
  </g>

  <!-- floating particles -->
  <g fill="#8b5cf6">
    <circle cx="120" cy="80" r="2"><animate attributeName="cy" values="80;320;80" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="340" r="3" fill="#ec4899"><animate attributeName="cy" values="340;60;340" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="120" r="2" fill="#06b6d4"><animate attributeName="cy" values="120;360;120" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="280" r="2" fill="#10b981"><animate attributeName="cy" values="280;40;280" dur="13s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="60" r="2" fill="#f59e0b"><animate attributeName="cy" values="60;340;60" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="360" r="3"><animate attributeName="cy" values="360;80;360" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="14s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name -->
  <text x="600" y="180" text-anchor="middle" font-size="78" font-weight="900" fill="url(#name)" letter-spacing="4">
    SHARANG PARNERKAR
  </text>
  <text x="600" y="180" text-anchor="middle" font-size="78" font-weight="900" fill="url(#name)" letter-spacing="4" opacity="0.4" filter="url(#blur)">
    SHARANG PARNERKAR
  </text>

  <!-- subtitle -->
  <text x="600" y="225" text-anchor="middle" font-size="20" fill="url(#sub)" letter-spacing="6" font-weight="300">
    SYSTEMS · RUST · AI · INFRASTRUCTURE
  </text>

  <!-- typing tagline -->
  <g font-size="18" fill="#10b981">
    <text x="600" y="280" text-anchor="middle">
      <tspan>$ whoami</tspan>
      <animate attributeName="opacity" values="1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.2;0.21;1"/>
    </text>
    <text x="600" y="280" text-anchor="middle">
      <tspan>building orchestrators that don't suck</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.21;0.22;0.4;0.41;1"/>
    </text>
    <text x="600" y="280" text-anchor="middle">
      <tspan>shipping firmware to ARM Cortex-M boards</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.41;0.42;0.6;0.61;1"/>
    </text>
    <text x="600" y="280" text-anchor="middle">
      <tspan>turning open data into answers</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.61;0.62;0.8;0.81;1"/>
    </text>
    <text x="600" y="280" text-anchor="middle">
      <tspan>self-hosted everything, owned nothing rented</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.81;0.82;0.99;1"/>
    </text>
  </g>

  <!-- stat pills -->
  <g font-size="14" font-weight="600">
    <g transform="translate(380,320)">
      <rect width="120" height="36" rx="18" fill="#1e293b" stroke="#334155"/>
      <text x="60" y="23" text-anchor="middle" fill="#f59e0b">19 REPOS</text>
    </g>
    <g transform="translate(520,320)">
      <rect width="160" height="36" rx="18" fill="#1e293b" stroke="#334155"/>
      <text x="80" y="23" text-anchor="middle" fill="#ec4899">703 CONTRIBUTIONS</text>
    </g>
    <g transform="translate(700,320)">
      <rect width="120" height="36" rx="18" fill="#1e293b" stroke="#334155"/>
      <text x="60" y="23" text-anchor="middle" fill="#06b6d4">95 STARS</text>
    </g>
  </g>

  <!-- corner brackets -->
  <g stroke="#8b5cf6" stroke-width="2" fill="none">
    <path d="M20 20 L20 60 M20 20 L60 20"/>
    <path d="M1180 20 L1180 60 M1180 20 L1140 20"/>
    <path d="M20 380 L20 340 M20 380 L60 380"/>
    <path d="M1180 380 L1180 340 M1180 380 L1140 380"/>
  </g>
</svg>
